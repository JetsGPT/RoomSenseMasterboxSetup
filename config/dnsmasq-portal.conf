# dnsmasq config for captive portal DNS hijack
# Do NOT provide DHCP here to avoid conflicts with NetworkManager hotspot
no-hosts
# Bind only to the interface specified on the command line (--interface)
bind-interfaces
# Never read /etc/resolv.conf
no-resolv
# Upstream DNS servers (fallback if needed)
server=1.1.1.1
server=8.8.8.8
# Redirect all domains to the AP address (wildcard catch-all)
address=/#/10.42.0.1
# Explicitly redirect common captive portal detection domains
# Apple devices
address=/captive.apple.com/10.42.0.1
address=/www.apple.com/10.42.0.1
# Android/Chrome devices
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/android.clients.google.com/10.42.0.1
# Windows devices
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1
# Log to syslog (disabled detailed queries by default)
log-queries
