# dnsmasq config for captive portal DNS hijack
# Do NOT provide DHCP here to avoid conflicts with NetworkManager hotspot
no-hosts
# Bind only to the interface specified on the command line (--interface)
bind-interfaces
# Never read /etc/resolv.conf
no-resolv
# Upstream DNS servers (fallback if needed)
server=1.1.1.1
server=8.8.8.8
# Redirect all domains to the AP address
address=/#/10.42.0.1
# Log to syslog (disabled detailed queries by default)
log-queries
