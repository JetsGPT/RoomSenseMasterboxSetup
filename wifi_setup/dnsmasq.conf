# Dnsmasq config for RoomSense Captive Portal
# Redirect all domains to our IP
address=/#/10.42.0.1

# Listen on the interface (will be set by command line or here)
# interface=wlan0
# bind-interfaces

# DHCP is handled by NetworkManager's 'shared' method usually, 
# but if we want to be sure, we can let NM handle DHCP and we just do DNS.
# However, NM might spawn its own dnsmasq. 
# Strategy: We will run this dnsmasq instance specifically for the captive portal
# and ensure it doesn't conflict. 
# Actually, if NM is doing 'shared', it starts a dnsmasq. 
# We might need to configure NM to use this config.
# NetworkManager looks in /etc/NetworkManager/dnsmasq-shared.d/ for config.

# So this file will be copied there.
