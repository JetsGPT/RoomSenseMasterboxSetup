<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomSense - Wi-Fi Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-group {
            margin-top: 20px;
        }

        .password-toggle {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        .refresh-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        .connect-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .connect-btn:active {
            transform: translateY(0);
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .signal-strength {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }

        .network-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        option {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔌 RoomSense</h1>
            <p>Connect to your Wi-Fi network</p>
        </div>

        <form id="wifi-form">
            <div class="form-group">
                <label for="ssid">Select Wi-Fi Network</label>
                <button type="button" class="refresh-btn" id="refresh-btn">
                    🔄 Refresh Networks
                </button>
                <select id="ssid" name="ssid" required>
                    <option value="">Scanning for networks...</option>
                </select>
            </div>

            <div class="form-group password-group">
                <label for="password">Password (leave blank for open networks)</label>
                <div class="password-toggle">
                    <input type="password" id="password" name="password" placeholder="Enter Wi-Fi password">
                    <button type="button" class="toggle-password" id="toggle-password">👁️</button>
                </div>
            </div>

            <button type="submit" class="connect-btn" id="connect-btn">
                Connect
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Connecting...</p>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        const ssidSelect = document.getElementById('ssid');
        const passwordInput = document.getElementById('password');
        const connectBtn = document.getElementById('connect-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');
        const togglePassword = document.getElementById('toggle-password');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Load networks on page load
        loadNetworks();

        // Refresh networks
        refreshBtn.addEventListener('click', loadNetworks);

        async function loadNetworks() {
            ssidSelect.innerHTML = '<option value="">Scanning for networks...</option>';
            connectBtn.disabled = true;
            refreshBtn.disabled = true;

            try {
                const response = await fetch('/api/networks');
                const networks = await response.json();

                ssidSelect.innerHTML = '';
                
                if (networks.length === 0) {
                    ssidSelect.innerHTML = '<option value="">No networks found</option>';
                } else {
                    networks.forEach(network => {
                        const option = document.createElement('option');
                        option.value = network.ssid;
                        const signalBars = getSignalBars(network.signal);
                        option.textContent = `${network.ssid} ${signalBars} ${network.security}`;
                        ssidSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading networks:', error);
                ssidSelect.innerHTML = '<option value="">Error loading networks</option>';
            } finally {
                connectBtn.disabled = false;
                refreshBtn.disabled = false;
            }
        }

        function getSignalBars(signal) {
            const signalNum = parseInt(signal) || 0;
            if (signalNum >= -50) return '📶📶📶';
            if (signalNum >= -70) return '📶📶';
            return '📶';
        }

        // Handle form submission
        document.getElementById('wifi-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ssid = ssidSelect.value;
            const password = passwordInput.value;

            if (!ssid) {
                showMessage('Please select a network', 'error');
                return;
            }

            connectBtn.disabled = true;
            loading.classList.add('active');
            message.classList.remove('success', 'error');

            try {
                const response = await fetch('/api/connect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid, password }),
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    
                    // Reboot after a short delay
                    setTimeout(async () => {
                        try {
                            await fetch('/api/reboot', { method: 'POST' });
                        } catch (error) {
                            console.error('Error rebooting:', error);
                        }
                    }, 2000);
                } else {
                    showMessage(data.message || 'Connection failed', 'error');
                    connectBtn.disabled = false;
                    loading.classList.remove('active');
                }
            } catch (error) {
                console.error('Error connecting:', error);
                showMessage('Failed to connect. Please try again.', 'error');
                connectBtn.disabled = false;
                loading.classList.remove('active');
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }
    </script>
</body>
</html>
