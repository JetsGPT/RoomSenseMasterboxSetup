<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomSense Setup</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        p {
            margin: 0;
            color: #64748b;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .network-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .network-item {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .network-item:last-child {
            border-bottom: none;
        }

        .network-item:hover {
            background: #f1f5f9;
        }

        .ssid {
            font-weight: 500;
        }

        .signal-icon {
            color: #64748b;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
        }

        .modal h3 {
            margin-top: 0;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-message {
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Connect to WiFi</h1>
            <p>Select a network to connect your RoomSense device.</p>
        </header>

        <div class="card">
            <div id="loading" style="padding: 20px; text-align: center;">

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="connect()">Connect</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="statusModal">
        <div class="modal" style="text-align: center;">
            <h3>Connecting...</h3>
            <div class="spinner" id="statusSpinner" style="display: block;"></div>
            <p id="statusText">Please wait while we connect to the network.</p>
        </div>
    </div>

    <script>
        let selectedNetwork = null;

        async function scanNetworks() {
            const list = document.getElementById('networkList');
            const loading = document.getElementById('loading');

            list.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/scan');
                const networks = await response.json();

                loading.style.display = 'none';

                networks.forEach(net => {
                    const li = document.createElement('li');
                    li.className = 'network-item';
                    li.innerHTML = `
                        <span class="ssid">${net.ssid}</span>
                        <span class="signal-icon">${net.bars}</span>
                    `;
                    li.onclick = () => openModal(net.ssid);
                    list.appendChild(li);
                });
            } catch (e) {
                loading.innerText = "Failed to scan. Please try again.";

        function openModal(ssid) {

            document.getElementById('passwordInput').focus();
        }

        function closeModal() {
            document.getElementById('passwordModal').style.display = 'none';
            selectedNetwork = null;

            try {

                <body>
                    <div class="container">
                        <header>
                            <h1>Connect to WiFi</h1>
                            <p>Select a network to connect your RoomSense device.</p>
                        </header>

                        <div class="card">
                            <div id="loading" style="padding: 20px; text-align: center;">
                                Scanning for networks...
                            </div>
                            <ul class="network-list" id="networkList"></ul>
                        </div>

                        <button class="btn" onclick="scanNetworks()">Rescan</button>
                    </div>

                    <div class="modal-overlay" id="passwordModal">
                        <div class="modal">
                            <h3 id="modalTitle">Enter Password</h3>
                            <p id="selectedSSID" style="margin-bottom: 10px; font-weight: bold;"></p>
                            <input type="password" id="passwordInput" placeholder="Password">
                                <div class="modal-actions">
                                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                                    <button class="btn" onclick="connect()">Connect</button>
                                </div>
                        </div>
                    </div>

                    <div class="modal-overlay" id="statusModal">
                        <div class="modal" style="text-align: center;">
                            <h3>Connecting...</h3>
                            <div class="spinner" id="statusSpinner" style="display: block;"></div>
                            <p id="statusText">Please wait while we connect to the network.</p>
                        </div>
                    </div>

                    <script>
                        let selectedNetwork = null;

                        async function scanNetworks() {
            const list = document.getElementById('networkList');
                        const loading = document.getElementById('loading');

                        list.innerHTML = '';
                        loading.style.display = 'block';

                        try {
                const response = await fetch('/api/scan');
                        const networks = await response.json();

                        loading.style.display = 'none';

                networks.forEach(net => {
                    const li = document.createElement('li');
                        li.className = 'network-item';
                        li.innerHTML = `
                        <span class="ssid">${net.ssid}</span>
                        <span class="signal-icon">${net.bars}</span>
                        `;
                    li.onclick = () => openModal(net.ssid);
                        list.appendChild(li);
                });
            } catch (e) {
                            loading.innerText = "Failed to scan. Please try again.";
            }
        }

                        function openModal(ssid) {
                            selectedNetwork = ssid;
                        document.getElementById('selectedSSID').innerText = ssid;
                        document.getElementById('passwordInput').value = '';
                        document.getElementById('passwordModal').style.display = 'flex';
                        document.getElementById('passwordInput').focus();
        }

                        function closeModal() {
                            document.getElementById('passwordModal').style.display = 'none';
                        selectedNetwork = null;
        }

                        async function connect() {
            const password = document.getElementById('passwordInput').value;
                        closeModal();

                        document.getElementById('statusModal').style.display = 'flex';
                        document.getElementById('statusText').innerText = `Connecting to ${selectedNetwork}...`;

                        try {
                            await fetch('/api/connect', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ssid: selectedNetwork, password: password })
                            });

                        pollStatus();

            } catch (e) {
                            document.getElementById('statusText').innerText = "Error sending request.";
            }
        }

                        async function pollStatus() {
                            let errorCount = 0;
            const interval = setInterval(async () => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000); // 2 second timeout

                        try {
                    const response = await fetch('/api/status', {signal: controller.signal });
                        clearTimeout(timeoutId);
                        const data = await response.json();

                        document.getElementById('statusText').innerText = data.message;

                        if (data.status === 'success') {
                            clearInterval(interval);
                        document.getElementById('statusSpinner').style.display = 'none';
                        document.getElementById('statusText').innerText = "Success! Rebooting...";
                    } else if (data.status === 'failed') {
                            clearInterval(interval);
                        document.getElementById('statusSpinner').style.display = 'none';
                        setTimeout(() => {
                            document.getElementById('statusModal').style.display = 'none';
                        }, 3000);
                    }
                        errorCount = 0;
                } catch (e) {
                            clearTimeout(timeoutId);
                        console.error(e);
                        errorCount++;

                    // If we fail 3 times in a row (approx 3-4 seconds), assume AP is gone.
                    if (errorCount >= 3) {
                            clearInterval(interval);
                        document.getElementById('statusSpinner').style.display = 'none';
                        document.getElementById('statusText').innerHTML =
                        "<strong>Connection Lost</strong><br><br>" +
                            "The Hotspot has stopped responding. This usually means the Pi has successfully connected to the new network and is rebooting.<br><br>" +
                                "Please connect your device to the new network.";
                    }
                }
            }, 1000);
        }

                                // Initial scan
                                scanNetworks();
    </script>
